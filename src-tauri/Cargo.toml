[package]
name = "openform-cad"
version = "0.8.0"
description = "OpenForm CAD – Desktop-App"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] } # Origin für lokales Ollama setzen (siehe src/ai.ts)

[profile.release]
strip = true
lto = true
