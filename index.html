<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OpenForm CAD</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#1e2126; --panel:#2a2e35; --line:#3a3f48; --text:#e6e8eb; --muted:#9aa1ab; --accent:#ff9a3c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,sans-serif; }
  canvas { display:block; }
  #toolbar { position:fixed; left:12px; top:120px; max-height:calc(100% - 270px); overflow-y:auto; display:flex; flex-direction:column; gap:2px; /* nur so hoch wie die Werkzeuge, bei kleinen Fenstern scrollen */
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px; }
  #toolbar button, #top button { background:transparent; color:var(--text); border:1px solid transparent; border-radius:10px;
    padding:6px 10px; cursor:pointer; font:inherit; text-align:left; }
  #toolbar button:hover, #top button:hover { background:#353a42; }
  #toolbar button { padding:2px 10px; } /* 18 Einträge: passt so ohne Scrollen in 768 px Fensterhöhe */
  #toolbar button.on { border-color:var(--accent); color:var(--accent); }
  #toolbar kbd { float:right; margin-left:14px; color:var(--muted); font:11px monospace; }
  #top { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:4px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; }
  #panel { position:fixed; right:12px; top:12px; width:220px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px; display:none; }
  #panel h3 { margin:0 0 10px; font-size:13px; }
  #panel label { display:flex; justify-content:space-between; align-items:center; margin:6px 0; color:var(--muted); }
  #panel select { background:#1e2126; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:3px; font:inherit; max-width:120px; }
  #panel details { margin:8px 0; color:var(--muted); }
  #panel button.act { display:block; width:100%; margin:4px 0; background:#353a42; color:var(--text); border:0; border-radius:6px; padding:6px; cursor:pointer; font:inherit; }
  #panel details button { display:block; width:100%; margin:4px 0; background:#353a42; color:var(--text); border:0; border-radius:6px; padding:5px; cursor:pointer; font:inherit; }
  #panel input { width:90px; background:#1e2126; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:inherit; }
  #panel .del { margin-top:10px; width:100%; background:#4a2a2a; color:#ffb4b4; border:0; border-radius:8px; padding:7px; cursor:pointer; }
  #tree { position:fixed; right:12px; bottom:48px; width:220px; max-height:35vh; overflow:auto; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:8px; }
  #tree h3 { margin:0 0 6px; font-size:12px; color:var(--muted); font-weight:600; }
  #tree .row { display:flex; align-items:center; gap:4px; padding:3px 6px; border-radius:6px; cursor:pointer; }
  #tree .row:hover { background:#353a42; }
  #tree .row.on { color:var(--accent); }
  #tree .row.off span { opacity:.45; text-decoration:line-through; }
  #tree .row span { flex:1; outline:none; }
  #tree .row.later { opacity:.4; font-style:italic; }
  #tree .row.bad span { color:#e5736b; }
  #tree .row.unsure span { color:#e0b84f; }
  #aiDlg { position:fixed; inset:0; z-index:60; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; padding:16px; }
  #aiDlg .box { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px; width:min(460px, 100%); }
  #aiDlg h3 { margin:0 0 10px; }
  #aiDlg label { display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0; color:var(--muted); }
  #aiDlg label.row, #aiDlg .row { display:flex; justify-content:flex-start; gap:8px; align-items:center; color:var(--text); }
  #aiDlg input:not([type=checkbox]) { flex:1; background:#1e2126; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 7px; font:inherit; }
  #aiDlg button { background:#353a42; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  #aiDlg .presets { display:flex; gap:6px; flex-wrap:wrap; margin:8px 0; }
  #aiDlg .warn { color:#ffcf8a; font-size:12px; margin:6px 0; }
  #aiDlg .note, #aiDlg .keynote { color:var(--muted); font-size:12px; margin:4px 0; min-height:1em; }
  #sheetEd { position:fixed; inset:0; z-index:50; background:#2a2e35; display:none; flex-direction:column; }
  #sheetEd .bar { display:flex; gap:6px; align-items:center; padding:8px 10px; background:var(--panel); flex-wrap:wrap; }
  #sheetEd .bar button.on { color:var(--accent); outline:1px solid var(--accent); }
  #sheetEd .hint { padding:4px 12px; color:var(--muted); font-size:12px; }
  #sheetEd .area { flex:1; min-height:0; padding:10px; display:flex; justify-content:center; cursor:crosshair; }
  #sheetEd .area svg { height:100%; max-width:100%; box-shadow:0 2px 12px #0008; }
  #sheetEd [data-dim] { cursor:move; }
  #tree .row span[contenteditable=true] { background:#1e2126; border-radius:4px; padding:0 3px; }
  #tree .rollEnd { display:block; width:100%; margin:0 0 6px; background:#4a3a20; color:var(--accent); border-radius:6px; padding:4px; }
  #tree button { background:transparent; color:var(--muted); border:0; cursor:pointer; padding:0 4px; font:inherit; }
  #palette { position:fixed; top:70px; left:50%; transform:translateX(-50%); width:340px; background:var(--panel);
    border:1px solid var(--accent); border-radius:12px; padding:8px; display:none; z-index:10; }
  #palette input { width:100%; background:#1e2126; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 9px; font:inherit; }
  #palette div div { padding:5px 9px; border-radius:6px; cursor:pointer; }
  #palette div div:hover, #palette div div.first { background:#353a42; }
  #views { position:fixed; left:12px; bottom:14px; width:250px; display:flex; flex-wrap:wrap; gap:4px; background:var(--panel);
    border:1px solid var(--line); border-radius:12px; padding:5px; }
  #views button { background:transparent; color:var(--text); border:1px solid transparent; border-radius:8px; padding:4px 7px; cursor:pointer; font:inherit; }
  #views button:hover { background:#353a42; }
  #views label { color:var(--muted); font-size:12px; display:inline-flex; align-items:center; gap:3px; }
  #views select { background:#1e2126; color:var(--text); border:1px solid var(--line); border-radius:5px; font:inherit; }
  #toolbar button svg { width:16px; height:16px; vertical-align:-3px; margin-right:7px; fill:none; stroke:currentColor; stroke-width:1.5; stroke-linejoin:round; stroke-linecap:round; }
  #views input[type=color] { width:26px; height:24px; border:0; padding:0; background:transparent; cursor:pointer; vertical-align:middle; }
  #views button.on { border-color:var(--accent); color:var(--accent); }
  #measLabel { position:fixed; pointer-events:none; font:12px system-ui; color:#1e2126; background:#ff9a3c; border-radius:5px; padding:2px 7px; display:none; transform:translate(-50%, -130%); white-space:nowrap; }
  #snapTip { position:fixed; pointer-events:none; font:11px system-ui; color:#1e2126; background:#ffd2a8; border-radius:4px; padding:1px 5px; display:none; }
  #hud b { display:inline-block; min-width:34px; background:#1e2126; color:var(--accent); border-radius:4px; padding:0 4px; margin:0 2px; text-align:right; }
  #hud b.on { outline:2px solid #1e2126; background:#fff; color:#1e2126; }
  #toolbar .dd { float:right; margin-left:6px; padding:0 4px; border-radius:4px; color:var(--muted); }
  #toolbar .dd:hover { background:#454b55; color:var(--text); }
  #toolbar small.mode { color:var(--muted); font-size:11px; margin-left:3px; }
  #snapMenu { position:fixed; display:none; z-index:20; left:270px; bottom:14px; width:300px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:8px 12px; flex-direction:column; gap:5px; }
  #snapMenu b { margin-top:4px; color:var(--muted); font-weight:600; }
  #snapMenu label { display:flex; align-items:center; gap:6px; }
  #snapMenu small { color:var(--muted); }
  #snapMenu select { background:#1e2126; color:var(--text); border:1px solid var(--line); border-radius:5px; font:inherit; }
  #flyout { position:fixed; display:none; z-index:20; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px; }
  #flyout button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-radius:6px; padding:5px 12px; cursor:pointer; font:inherit; }
  #flyout button:hover { background:#353a42; }
  #flyout button.on { color:var(--accent); }
  #ctx { position:fixed; display:none; z-index:20; min-width:190px; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:4px;
    box-shadow:0 6px 24px rgba(0,0,0,.4); }
  #ctx button { display:block; width:100%; text-align:left; background:transparent; color:var(--text); border:0; border-radius:6px; padding:6px 10px; cursor:pointer; font:inherit; }
  #ctx button:hover { background:#353a42; }
  #ctx hr { border:0; border-top:1px solid var(--line); margin:3px 0; }
  #cube { position:fixed; left:12px; top:12px; width:96px; height:96px; }
  #cube .face { width:56px; height:56px; display:flex; align-items:center; justify-content:center; font:600 10px system-ui; color:var(--text);
    background:rgba(53,58,66,.92); border:1px solid #5a606b; box-sizing:border-box; cursor:pointer; user-select:none; }
  #cube .face:hover { background:var(--accent); color:#1e2126; }
  #dims { position:fixed; inset:0; pointer-events:none; }
  #dims span { position:absolute; transform:translate(-50%,-50%); font:11px system-ui; color:var(--text); background:rgba(42,46,53,.85);
    border-radius:4px; padding:1px 4px; white-space:nowrap; }
  #dims span { pointer-events:auto; cursor:text; }
  #dims span:hover { outline:1px solid var(--accent); }
  #dims input { position:absolute; transform:translate(-50%,-50%); width:6em; font:11px system-ui; pointer-events:auto; }
  #boxSel { position:fixed; display:none; border:1px dashed var(--accent); background:rgba(255,154,60,.08); pointer-events:none; z-index:5; }
  #dims span.lock { background:var(--accent); color:#1e2126; font-weight:600; }
  #panel .cons input { width:58px; }
  #panel .cons input.lock { border-color:var(--accent); }
  #panel .cons span { display:flex; gap:2px; align-items:center; }
  #panel .cons .hv, #panel .cons .pair button, #panel .cons .con button { background:#353a42; color:var(--text); border:1px solid transparent; border-radius:5px;
    padding:2px 6px; cursor:pointer; font:inherit; width:auto; margin:0; display:inline-block; }
  #panel .cons .hv.on { border-color:var(--accent); color:var(--accent); }
  #panel .cons .pair { display:flex; gap:4px; justify-content:flex-end; margin:4px 0; }
  #panel .cons .con { display:flex; justify-content:space-between; align-items:center; margin:3px 0; color:var(--text); }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:6px 12px; pointer-events:none; max-width:calc(100vw - 540px); }
  #scale { position:fixed; right:16px; bottom:16px; color:var(--muted); font:12px system-ui; text-align:center; pointer-events:none; }
  #scale div { height:6px; border:2px solid var(--muted); border-top:none; margin-bottom:3px; }
  #hud { position:fixed; pointer-events:none; background:var(--accent); color:#1e2126; font-weight:600; border-radius:6px;
    padding:2px 6px; display:none; }
</style>
</head>
<body>
<div id="toolbar">
  <button data-tool="select">Auswählen / Ziehen <kbd>V</kbd></button>
  <button data-tool="rect">Rechteck <small class="mode"></small><kbd>R</kbd><span class="dd" data-menu="rect" title="Art wählen">▸</span></button>
  <button data-tool="circle">Kreis <kbd>C</kbd></button>
  <button data-tool="ellipse">Ellipse <kbd>I</kbd></button>
  <button data-tool="ngon">Vieleck <small class="mode"></small><kbd>N</kbd><span class="dd" data-menu="ngon" title="Ecken wählen">▸</span></button>
  <button data-tool="slot">Langloch <kbd>O</kbd></button>
  <button data-tool="line">Linie <kbd>L</kbd></button>
  <button data-tool="aux" title="Hilfslinie: bildet keine Fläche, nur zum Einrasten">Hilfslinie <kbd>G</kbd></button>
  <button data-tool="trim" title="Hilfslinie trimmen (Klick) oder verlängern (Shift+Klick)">Trimmen <kbd>T</kbd></button>
  <button data-tool="arc">Bogen <kbd>A</kbd></button>
  <button data-tool="spline">Spline <kbd>S</kbd></button>
  <button data-tool="shell">Schale <kbd>H</kbd></button>
  <button data-tool="plane">Ebene <kbd>E</kbd></button>
  <button data-tool="text" title="Text auf Boden oder Fläche: erhaben oder graviert">Text</button>
  <button data-act="move" title="Ausgewählten Körper (oder den Körper der Skizze) mit Griffen verschieben/drehen">Verschieben / Drehen<span class="dd" data-menu="xf" title="Transformieren: Skalieren, Werte, Drehen um Achse, Ausrichten …">▸</span></button>
  <button data-act="pattern" title="Ausgewählten Körper oder Skizze als Reihe oder Kreis vervielfältigen">Muster</button>
  <button data-act="mirror" title="Ausgewählten Körper oder Skizze spiegeln">Spiegeln</button>
  <button data-tool="measure">Messen <small class="mode"></small><kbd>M</kbd><span class="dd" data-menu="measure" title="Art des Messens">▸</span></button>
</div>
<div id="top">
  <button id="bNew" title="Neues, leeres Modell">Neu</button>
  <button id="bUndo" title="Rückgängig (Strg+Z)">↶ Rückgängig</button>
  <button id="bRedo" title="Wiederholen (Strg+Y)">↷ Wiederholen</button>
  <button id="bSave" title="Modell als .ofc speichern (Strg+S, Strg+Umschalt+S = unter neuem Namen)">Speichern</button>
  <button id="bOpen" title=".ofc öffnen oder .step/.stp importieren (Strg+O)">Öffnen</button>
  <button id="bStl" title="Für den 3D-Druck">STL-Export</button>
  <button id="bStep" title="Für CAD und Fertigung">STEP-Export</button>
  <button id="bSvg" title="Zeichnungsblatt (SVG, PDF), DXF, OBJ">Zeichnung / mehr ▾</button>
  <input id="fileIn" type="file" accept=".ofc,.json,.step,.stp" hidden>
</div>
<div id="panel"></div>
<div id="hud"></div>
<div id="snapTip"></div>
<div id="ctx"></div>
<div id="flyout"></div>
<div id="boxSel"></div>
<div id="measLabel"></div>
<div id="snapMenu">
  <b>Einrasten an</b>
  <label><input type="checkbox" data-snap="grid"> Raster</label>
  <label><input type="checkbox" data-snap="lines"> Hilfslinien (ausrichten, waagrecht, parallel …)</label>
  <label><input type="checkbox" data-snap="points"> Punkte der Skizzen</label>
  <label><input type="checkbox" data-snap="body"> Punkte am Körper (Flächenraster)</label>
  <label><input type="checkbox" data-snap="edges"> Körperkanten</label>
  <b>Anzeigen</b>
  <label><input type="checkbox" data-snap="showPts"> Rastpunkte</label>
  <label><input type="checkbox" data-snap="hints"> Hinweise am Zeiger</label>
  <label title="Rastergröße beim Skizzieren">Raster <select id="gridStep"><option value="0">Auto</option><option>0.1</option><option>0.5</option><option selected>1</option><option>5</option><option>10</option></select> mm</label>
  <small>Shift beim Zeichnen = frei, ohne Einrasten</small>
</div>
<div id="cube"></div>
<div id="tree"></div>
<div id="dims"></div>
<div id="views">
  <button data-view="iso" title="Taste 0">Iso</button><button data-view="top" title="Taste 2">Oben</button>
  <button data-view="front" title="Taste 1">Vorne</button><button data-view="right" title="Taste 3">Rechts</button>
  <button data-view="fit" title="Taste F">Einpassen</button>
  <button data-show="wire">Draht</button><button data-show="glass">Transparent</button><button data-show="edges" class="on">Kanten</button>
  <button data-show="section" title="Schnitt durch die Mitte: aus → X → Y → Z">Schnitt</button><button data-show="render">Render</button>
  <input type="range" id="secOff" min="-1" max="1" step="0.01" value="0" title="Schnittebene verschieben" style="width:100%">
  <label title="Farbe des Körpers"><input type="color" id="bodyColor" value="#c9ced6"></label>
  <button id="bSnap" title="Einrasten: was rastet ein, Rastergröße">Einrasten ▸</button>
  <label title="Einheit für Anzeige und Eingabe (das Modell rechnet in mm)">Einheit <select id="unit"><option value="mm">mm</option><option value="in">Zoll</option></select></label>
</div>
<div id="palette"><input placeholder="Werkzeug oder Befehl suchen …"><div></div></div>
<div id="scale"><div></div><span></span></div>
<div id="hint">CAD-Kern wird geladen (großer Download, nur beim ersten Mal langsam) …</div>

<script type="module" src="/src/main.ts"></script>
</body>
