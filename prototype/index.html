<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OpenForm CAD</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#1e2126; --panel:#2a2e35; --line:#3a3f48; --text:#e6e8eb; --muted:#9aa1ab; --accent:#ff9a3c; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,sans-serif; }
  canvas { display:block; }
  #toolbar { position:fixed; left:12px; top:50%; transform:translateY(-50%); display:flex; flex-direction:column; gap:6px;
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px; }
  #toolbar button, #top button { background:transparent; color:var(--text); border:1px solid transparent; border-radius:10px;
    padding:8px 10px; cursor:pointer; font:inherit; text-align:left; }
  #toolbar button:hover, #top button:hover { background:#353a42; }
  #toolbar button.on { border-color:var(--accent); color:var(--accent); }
  #toolbar kbd { float:right; margin-left:14px; color:var(--muted); font:11px monospace; }
  #top { position:fixed; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:4px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:4px; }
  #panel { position:fixed; right:12px; top:12px; width:220px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px; display:none; }
  #panel h3 { margin:0 0 10px; font-size:13px; }
  #panel label { display:flex; justify-content:space-between; align-items:center; margin:6px 0; color:var(--muted); }
  #panel input { width:90px; background:#1e2126; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:4px 6px; font:inherit; }
  #panel .del { margin-top:10px; width:100%; background:#4a2a2a; color:#ffb4b4; border:0; border-radius:8px; padding:7px; cursor:pointer; }
  #hint { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); color:var(--muted); background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:6px 12px; pointer-events:none; }
  #hud { position:fixed; pointer-events:none; background:var(--accent); color:#1e2126; font-weight:600; border-radius:6px;
    padding:2px 6px; display:none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="toolbar">
  <button data-tool="select">Auswählen / Ziehen <kbd>V</kbd></button>
  <button data-tool="rect">Rechteck <kbd>R</kbd></button>
  <button data-tool="circle">Kreis <kbd>C</kbd></button>
</div>
<div id="top">
  <button id="bNew">Neu</button>
  <button id="bUndo">↶ Rückgängig</button>
  <button id="bRedo">↷ Wiederholen</button>
  <button id="bSave">Speichern</button>
  <button id="bOpen">Öffnen</button>
  <button id="bStl">STL-Export</button>
  <button id="bView">Ansicht</button>
  <input id="fileIn" type="file" accept=".json" hidden>
</div>
<div id="panel"></div>
<div id="hud"></div>
<div id="hint"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { STLExporter } from 'three/addons/exporters/STLExporter.js';

const V = a => new THREE.Vector3().fromArray(a);
const GROUND = { o:[0,0,0], n:[0,1,0], u:[1,0,0], v:[0,0,-1] };
const HINTS = {
  select: 'Klicken = auswählen · Fläche ziehen = extrudieren / Größe ändern · Linksziehen ins Leere = drehen · Rechts = verschieben',
  rect:   'Auf Boden oder Fläche ziehen, um ein Rechteck zu skizzieren',
  circle: 'Vom Mittelpunkt aus ziehen, um einen Kreis zu skizzieren',
};

// ---------- Szene ----------
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(devicePixelRatio);
document.body.prepend(renderer.domElement);
const el = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1e2126);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 5000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(80, 150, 60); scene.add(sun);
const grid = new THREE.GridHelper(400, 40, 0x555b66, 0x3a3f48); scene.add(grid);
const fine = new THREE.GridHelper(400, 400, 0x2c3037, 0x2c3037); fine.position.y = -0.01; scene.add(fine);
const group = new THREE.Group(); scene.add(group);
const preview = new THREE.Group(); scene.add(preview);

// Eigene Listener VOR OrbitControls registrieren, damit Werkzeuge Linksklicks übernehmen können
el.addEventListener('pointerdown', onDown);
const controls = new OrbitControls(camera, el);
controls.enableDamping = true;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.PAN, RIGHT: THREE.MOUSE.PAN };
function resetView() { camera.position.set(140, 110, 160); controls.target.set(0, 0, 0); }
resetView();

// ---------- Modell ----------
let features = [], nextId = 1, selId = null, tool = 'select', drag = null;
const undoStack = [], redoStack = [];
const snapshot = () => JSON.stringify({ features, nextId });
function pushHistory() { undoStack.push(snapshot()); redoStack.length = 0; }
function restore(s) { ({ features, nextId } = JSON.parse(s)); selId = null; refresh(); }
function undo() { if (undoStack.length) { redoStack.push(snapshot()); restore(undoStack.pop()); } }
function redo() { if (redoStack.length) { undoStack.push(snapshot()); restore(redoStack.pop()); } }
function save() { try { localStorage.setItem('openform', snapshot()); } catch {} }
const getSel = () => features.find(f => f.id === selId);

function shapeOf(f) {
  const s = new THREE.Shape();
  if (f.type === 'rect') {
    const { x, y, w, h } = f.p;
    s.moveTo(x, y); s.lineTo(x + w, y); s.lineTo(x + w, y + h); s.lineTo(x, y + h); s.closePath();
  } else s.absarc(f.p.cx, f.p.cy, f.p.r, 0, Math.PI * 2, false);
  return s;
}

function buildMesh(f, isPreview = false) {
  const flat = Math.abs(f.d) < 1e-6, sel = f.id === selId;
  let g;
  if (flat) g = new THREE.ShapeGeometry(shapeOf(f), 64);
  else {
    g = new THREE.ExtrudeGeometry(shapeOf(f), { depth: Math.abs(f.d), bevelEnabled: false, curveSegments: 64 });
    if (f.d < 0) g.translate(0, 0, f.d);
  }
  const mat = new THREE.MeshStandardMaterial({
    color: sel ? 0xff9a3c : flat ? 0x4da3ff : 0xc9ced6, transparent: flat, opacity: flat ? 0.4 : 1,
    side: THREE.DoubleSide, roughness: 0.6, metalness: 0.1,
    polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1,
  });
  const mesh = new THREE.Mesh(g, mat);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 20),
    new THREE.LineBasicMaterial({ color: sel ? 0xffd2a8 : flat || isPreview ? 0x8cc4ff : 0x1a1d22 }));
  edges.raycast = () => {};
  mesh.add(edges);
  mesh.matrixAutoUpdate = false;
  mesh.matrix.makeBasis(V(f.u), V(f.v), V(f.n)).setPosition(V(f.o));
  mesh.userData.id = f.id;
  mesh.userData.solid = !flat;
  return mesh;
}

function disposeGroup(gr) {
  gr.traverse(o => { o.geometry?.dispose(); o.material?.dispose(); });
  gr.clear();
}
function rebuild() { disposeGroup(group); features.forEach(f => group.add(buildMesh(f))); group.updateMatrixWorld(true); }
function refresh() { rebuild(); renderPanel(); save(); }

// ---------- Eingabe-Helfer ----------
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function setRay(e) {
  const r = el.getBoundingClientRect();
  ndc.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function pick() {
  const h = ray.intersectObjects(group.children, false)[0];
  if (!h) return null;
  const n = h.face.normal.clone().transformDirection(h.object.matrixWorld).normalize();
  return { f: features.find(f => f.id === h.object.userData.id), point: h.point.clone(), n };
}
function planeHit(pl) {
  const P = new THREE.Plane().setFromNormalAndCoplanarPoint(V(pl.n), V(pl.o));
  return ray.ray.intersectPlane(P, new THREE.Vector3());
}
function toLocal(pl, p) { const d = p.clone().sub(V(pl.o)); return [d.dot(V(pl.u)), d.dot(V(pl.v))]; }
const snap = (x, e, s = 1) => e.shiftKey ? x : Math.round(x / s) * s;
// Parameter s auf der Geraden P0 + s*D, der dem Mausstrahl am nächsten liegt
function lineParam(P0, D) {
  const R0 = ray.ray.origin, E = ray.ray.direction, w0 = P0.clone().sub(R0);
  const b = D.dot(E), d = D.dot(w0), e = E.dot(w0), den = 1 - b * b;
  return Math.abs(den) < 1e-6 ? null : (b * e - d) / den;
}
const hud = document.getElementById('hud');
function showHud(e, text) { hud.style.display = 'block'; hud.style.left = e.clientX + 16 + 'px'; hud.style.top = e.clientY + 16 + 'px'; hud.textContent = text; }

// ---------- Werkzeuge ----------
function onDown(e) {
  if (e.button !== 0) return;
  setRay(e);
  const h = pick();
  if (tool === 'rect' || tool === 'circle') {
    let pl = GROUND;
    if (h) { // auf Fläche skizzieren
      const n = h.n, helper = Math.abs(n.y) < 0.99 ? new THREE.Vector3(0, 1, 0) : new THREE.Vector3(1, 0, 0);
      const u = helper.clone().cross(n).normalize(), v = n.clone().cross(u);
      pl = { o: h.point.clone().addScaledVector(n, 0.02).toArray(), n: n.toArray(), u: u.toArray(), v: v.toArray() };
    }
    const p = planeHit(pl);
    if (!p) return;
    const a = toLocal(pl, p).map(x => snap(x, e));
    drag = { kind: 'sketch', pl, a, b: a };
  } else {
    if (!h) { if (selId !== null) { selId = null; rebuild(); renderPanel(); } return; } // Leere: Orbit
    selId = h.f.id; rebuild(); renderPanel();
    const dn = h.n.dot(V(h.f.n));
    drag = { kind: 'push', f: h.f, f0: structuredClone(h.f), P0: h.point, D: h.n, hitN: h.n,
             mode: dn > 0.99 ? 'capPlus' : dn < -0.99 ? 'capMinus' : 'side', sx: e.clientX, sy: e.clientY, started: false };
  }
  controls.enabled = false;
  el.setPointerCapture(e.pointerId);
}

function applyPush(f, f0, mode, t, hitN) {
  const n = V(f0.n);
  if (mode === 'capPlus') {
    if (f0.d >= 0) f.d = f0.d + t;
    else { f.o = V(f0.o).addScaledVector(n, t).toArray(); f.d = f0.d - t; }
    return ['Höhe', f.d];
  }
  if (mode === 'capMinus') {
    if (f0.d > 0) { f.o = V(f0.o).addScaledVector(n, -t).toArray(); f.d = f0.d + t; }
    else f.d = f0.d - t;
    return ['Höhe', f.d];
  }
  if (f.type === 'circle') { f.p.r = Math.max(0.5, f0.p.r + t); return ['Radius', f.p.r]; }
  const lu = hitN.dot(V(f0.u)), lv = hitN.dot(V(f0.v));
  if (Math.abs(lu) > 0.99) {
    f.p.w = Math.max(1, f0.p.w + t);
    if (lu < 0) f.p.x = f0.p.x + f0.p.w - f.p.w;
    return ['Breite', f.p.w];
  }
  if (Math.abs(lv) > 0.99) {
    f.p.h = Math.max(1, f0.p.h + t);
    if (lv < 0) f.p.y = f0.p.y + f0.p.h - f.p.h;
    return ['Tiefe', f.p.h];
  }
  return null;
}

el.addEventListener('pointermove', onMove);
function onMove(e) {
  setRay(e);
  if (!drag) {
    el.style.cursor = tool === 'select' ? (pick() ? 'grab' : 'default') : 'crosshair';
    return;
  }
  if (drag.kind === 'sketch') {
    const p = planeHit(drag.pl);
    if (!p) return;
    drag.b = toLocal(drag.pl, p).map(x => snap(x, e));
    const f = sketchFeature(drag);
    disposeGroup(preview);
    if (f) {
      preview.add(buildMesh(f, true));
      showHud(e, f.type === 'rect' ? `${f.p.w.toFixed(1)} × ${f.p.h.toFixed(1)} mm` : `R ${f.p.r.toFixed(1)} mm`);
    }
  } else {
    if (!drag.started) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 4) return;
      drag.started = true; pushHistory(); el.style.cursor = 'grabbing';
    }
    const s = lineParam(drag.P0, drag.D);
    if (s === null) return;
    const res = applyPush(drag.f, drag.f0, drag.mode, snap(s, e, 0.5), drag.hitN);
    if (res) { rebuild(); showHud(e, `${res[0]}: ${res[1].toFixed(1)} mm`); }
  }
}

function sketchFeature(d) {
  const [ax, ay] = d.a, [bx, by] = d.b, base = { id: nextId, d: 0, ...structuredClone(d.pl) };
  if (tool === 'rect') {
    const w = Math.abs(bx - ax), h = Math.abs(by - ay);
    if (w < 0.5 || h < 0.5) return null;
    return { ...base, type: 'rect', p: { x: Math.min(ax, bx), y: Math.min(ay, by), w, h } };
  }
  const r = Math.hypot(bx - ax, by - ay);
  return r < 0.5 ? null : { ...base, type: 'circle', p: { cx: ax, cy: ay, r } };
}

el.addEventListener('pointerup', e => {
  if (!drag) return;
  onMove(e); // Endposition übernehmen
  hud.style.display = 'none';
  if (drag.kind === 'sketch') {
    disposeGroup(preview);
    const f = sketchFeature(drag);
    if (f) { pushHistory(); nextId++; features.push(f); selId = f.id; setTool('select'); }
  }
  drag = null;
  controls.enabled = true;
  refresh();
});

// ---------- UI ----------
function setTool(t) {
  tool = t;
  document.querySelectorAll('#toolbar button').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  document.getElementById('hint').textContent = HINTS[t];
}
document.querySelectorAll('#toolbar button').forEach(b => b.onclick = () => setTool(b.dataset.tool));

const panel = document.getElementById('panel');
function renderPanel() {
  const f = getSel();
  if (!f) { panel.style.display = 'none'; return; }
  const fields = f.type === 'rect'
    ? [['X', 'p.x'], ['Y', 'p.y'], ['Breite', 'p.w'], ['Tiefe', 'p.h'], ['Höhe', 'd']]
    : [['Mitte X', 'p.cx'], ['Mitte Y', 'p.cy'], ['Radius', 'p.r'], ['Höhe', 'd']];
  const get = k => k.split('.').reduce((o, p) => o[p], f);
  panel.innerHTML = `<h3>${f.type === 'rect' ? 'Rechteck' : 'Kreis'} #${f.id}</h3>` +
    fields.map(([l, k]) => `<label>${l} <input type="number" step="0.5" data-k="${k}" value="${+get(k).toFixed(2)}"></label>`).join('') +
    `<button class="del">Löschen</button>`;
  panel.style.display = 'block';
  panel.querySelectorAll('input').forEach(inp => inp.onchange = () => {
    const v = parseFloat(inp.value);
    if (!isFinite(v)) return;
    pushHistory();
    const ks = inp.dataset.k.split('.');
    const obj = ks.length > 1 ? f[ks[0]] : f;
    obj[ks.at(-1)] = ['w', 'h', 'r'].includes(ks.at(-1)) ? Math.max(0.5, v) : v;
    refresh();
  });
  panel.querySelector('.del').onclick = deleteSel;
}
function deleteSel() {
  if (!getSel()) return;
  pushHistory(); features = features.filter(f => f.id !== selId); selId = null; refresh();
}

function download(name, blob) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
document.getElementById('bNew').onclick = () => { if (features.length) { pushHistory(); features = []; selId = null; refresh(); } };
document.getElementById('bUndo').onclick = undo;
document.getElementById('bRedo').onclick = redo;
document.getElementById('bView').onclick = resetView;
document.getElementById('bSave').onclick = () => download('modell.json', new Blob([snapshot()], { type: 'application/json' }));
const fileIn = document.getElementById('fileIn');
document.getElementById('bOpen').onclick = () => fileIn.click();
fileIn.onchange = async () => { const f = fileIn.files[0]; if (f) { pushHistory(); restore(await f.text()); } fileIn.value = ''; };
document.getElementById('bStl').onclick = () => {
  const solids = new THREE.Group();
  group.children.filter(m => m.userData.solid).forEach(m => {
    const c = new THREE.Mesh(m.geometry); c.matrixAutoUpdate = false; c.matrix.copy(m.matrix); solids.add(c);
  });
  solids.updateMatrixWorld(true);
  // CAD: Z oben; Szene: Y oben → beim Export drehen
  solids.rotation.x = Math.PI / 2; solids.updateMatrixWorld(true);
  const wrap = new THREE.Group(); wrap.add(solids); wrap.updateMatrixWorld(true);
  download('modell.stl', new Blob([new STLExporter().parse(wrap, { binary: true })], { type: 'model/stl' }));
};

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (e.ctrlKey && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (e.ctrlKey && k === 'y') { e.preventDefault(); redo(); }
  else if (k === 'v') setTool('select');
  else if (k === 'r') setTool('rect');
  else if (k === 'c') setTool('circle');
  else if (k === 'delete' || k === 'backspace') deleteSel();
  else if (k === 'escape') { drag = null; disposeGroup(preview); controls.enabled = true; selId = null; setTool('select'); refresh(); }
});

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

try { const s = localStorage.getItem('openform'); if (s) ({ features, nextId } = JSON.parse(s)); } catch {}
setTool('select'); refresh();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
